[package]
name = "SteamBooster"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "SteamBooster"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
steam-vent = "0.5.0"
steam-vent-proto-steam = "0.5.2"
steam-vent-proto-common = "0.5.1"
qrcode = "0.15.0"
reqwest = { version = "0.13.5", features = ["json", "socks"] }
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
steam-vent = { path = "crates/steam-vent" }

