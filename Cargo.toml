[package]
name = "SupBoost"
version = "1.2.2"
edition = "2021"

[[bin]]
name = "SupBoost"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
window-vibrancy = "0.5"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
steam-vent = "0.5.0"
steam-vent-proto-steam = "0.5.2"
steam-vent-proto-common = "0.5.1"
qrcode = "0.15.0"
reqwest = { version = "0.13.5", features = ["json", "socks", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.52"
tray-icon = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1"

[patch.crates-io]
steam-vent = { path = "crates/steam-vent" }

